import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

import { RenderPass } from "three/addons/postprocessing/RenderPass.js";

const q = new URLSearchParams(location.search);
const PYRAMID = q.get("mode") === "pyramid";
if (PYRAMID) document.body.classList.add("pyr");
if (q.get("cinema") === "1") document.body.classList.add("cinema");
addEventListener("keydown", e => {
  if (e.key === "c") document.body.classList.toggle("cinema");
  if (e.key === "p") location.search = PYRAMID ? "" : "?mode=pyramid";

const CYAN = new THREE.Color("#5CE1E6");
const LEVEL = { nom: ["#3DD68C", "NOMINAL ●"], cau: ["#F5B83D", "CAUTION ▲"], crit: ["#FF5D5D", "CRITICAL ■"] };
// ---------- what each body system forecasts ----------
// SIMULATED values for the demo crew. When the engine is live, /api/twin/<crew>/<system> replaces them.
// p = probability of crossing the clinical threshold within the horizon; band = 80 % interval on p.
// ttt_h = forecast hours until the threshold is crossed (drives the light-cone decision).
// chart: mu, sd (personal baseline), drift per step, thr (threshold), dir (+1 rises into risk, -1 falls)
const TWIN = {
  brain: { lv: "crit", name: "Fatigue before EVA", hrp: "Inadequate sleep and irregular schedules",
    q: "P(alertness below EVA minimum at EVA start)", p: .71, band: [.58, .82], horizon: "next 2 h", ttt_h: .42,
    lead: "Flagged 6.1 h before the EVA", sig: ["Sleep debt 3.4 h", "Reaction time +41 ms vs baseline", "Awake 17.6 h"],
    act: "EVA NO-GO. Postpone 4 h, 30 min bright light, repeat reaction test.",
    chart: { mu: 100, sd: 4, drift: -.35, thr: 82, dir: -1, unit: "% alertness" } },
  lymph: { lv: "cau", name: "Latent virus reactivation", hrp: "Altered immune system responses",
    q: "P(fever ≥ 38.0 °C within 24 h)", p: .62, band: [.48, .74], horizon: "24 h", ttt_h: 6.4,
    lead: "Detected 9.2 h before any vital left its normal range", sig: ["Core temp +0.38 °C", "Heart rate +7.6 bpm", "HRV −18 %"],
    act: "Fluids and rest, recheck temperature in 2 h. Antipyretic aboard (38 tablets).",
    chart: { mu: 36.9, sd: .12, drift: .012, thr: 38.0, dir: 1, unit: "°C core" } },
  eyes: { lv: "cau", name: "Optic disc swelling (SANS)", hrp: "Spaceflight Associated Neuro-ocular Syndrome",
    q: "P(optic nerve sheath +0.5 mm by day 90)", p: .34, band: [.19, .52], horizon: "90 d", ttt_h: 984,
    lead: "Trend visible since day 112", sig: ["ONSD +0.31 mm since launch", "Near vision −0.25 D"], prior: true,
    act: "Thigh cuffs and weekly eye scan. Thigh Cuff is an ongoing NASA study: effect is a hypothesis under test.",
    chart: { mu: 5.4, sd: .06, drift: .004, thr: 5.9, dir: 1, unit: "mm ONSD" } },
  hip: { lv: "cau", name: "Hip bone loss", hrp: "Spaceflight-induced bone changes",
    q: "P(hip BMD ≤ −10 % by mission end)", p: .58, band: [.41, .73], horizon: "mission end", ttt_h: 3120,
    lead: "Loss rate −1.27 %/month (NASA prior 1–1.5 %)", sig: ["Exercise load 86 % of plan", "Bone markers rising"], prior: true,
    act: "Resistance exercise to 100 % of plan. Discuss bisphosphonate with the flight surgeon.",
    chart: { mu: 0, sd: .4, drift: -.09, thr: -10, dir: -1, unit: "% hip BMD" } },
  heart: { lv: "nom", name: "Cardiovascular strain", hrp: "Cardiovascular adaptations",
    q: "P(resting heart rate > +2σ within 72 h)", p: .07, band: [.03, .13], horizon: "72 h", ttt_h: null,
    lead: "No pattern detected", sig: ["Resting HR 61 bpm (baseline 59)", "BP 118/76"], act: "Routine. Next check at 07:00.",
    chart: { mu: 59, sd: 2.5, drift: .01, thr: 66.5, dir: 1, unit: "bpm resting" } },
  lungs: { lv: "nom", name: "Low blood oxygen", hrp: "Hypoxia",
    q: "P(SpO₂ ≤ 92 % within 24 h)", p: .03, band: [.01, .07], horizon: "24 h", ttt_h: null,
    lead: "No pattern detected", sig: ["SpO₂ 97.4 %", "Cabin CO₂ 2.3 mmHg"], act: "Routine.",
    chart: { mu: 97.5, sd: .5, drift: 0, thr: 92, dir: -1, unit: "% SpO₂" } },
  spine: { lv: "nom", name: "Back pain", hrp: "Reduced cardiorespiratory and musculoskeletal fitness",
    q: "P(back pain ≥ 4/10 within 7 d)", p: .12, band: [.06, .21], horizon: "7 d", ttt_h: null,
    lead: "No pattern detected", sig: ["Pain 1/10 today"], act: "Routine stretching.",
    chart: { mu: 1, sd: .6, drift: .004, thr: 4, dir: 1, unit: "pain /10" } },
  gut: { lv: "nom", name: "Weight loss", hrp: "Inadequate food and nutrition",
    q: "P(body mass −5 % by mission end)", p: .09, band: [.04, .17], horizon: "mission end", ttt_h: null,
    lead: "No pattern detected", sig: ["Body mass −0.8 % since launch", "Intake 96 % of plan"], act: "Routine.", prior: true,
    chart: { mu: 0, sd: .3, drift: -.006, thr: -5, dir: -1, unit: "% body mass" } },
  leg: { lv: "nom", name: "Leg muscle loss", hrp: "Reduced cardiorespiratory and musculoskeletal fitness",
    q: "P(leg strength −15 % by day 90)", p: .21, band: [.11, .34], horizon: "90 d", ttt_h: null,
    lead: "No pattern detected", sig: ["Leg strength −3.9 % since launch"], act: "Keep exercise at plan.", prior: true,
    chart: { mu: 0, sd: .8, drift: -.03, thr: -15, dir: -1, unit: "% leg strength" } },
  ear: { lv: "nom", name: "Disorientation at Mars landing", hrp: "Altered sensorimotor and vestibular function",
    q: "P(severe motion sickness in first 48 h on Mars)", p: .27, band: [.15, .41], horizon: "landing + 48 h", ttt_h: null,
    lead: "Vestibular adaptation tracked since launch", sig: ["Head-movement test: adapted", "Gravity transition in 64 d"], prior: true,
    act: "Pre-landing adaptation training from day 200. Anti-nausea medicine aboard.",
    chart: { mu: 2, sd: .5, drift: .006, thr: 6, dir: 1, unit: "/10 symptom score" } },
  kidney: { lv: "cau", name: "Kidney stone risk", hrp: "Spaceflight-induced bone changes (calcium released from bone)",
    q: "P(stone-risk index above limit within 30 d)", p: .29, band: [.17, .43], horizon: "30 d", ttt_h: 410,
    lead: "Urine calcium rising since day 60", sig: ["Urine calcium +22 % since launch", "Fluid intake 2.1 L/day"],
    act: "Raise fluids to at least 2.5 L/day. Discuss potassium citrate with the flight surgeon.",
    chart: { mu: 1, sd: .08, drift: .004, thr: 1.5, dir: 1, unit: "risk index" } },
};
const status = Object.fromEntries(Object.entries(TWIN).map(([k, v]) => [k, v.lv]));
let oneWayS = 660;            // updated from /api/lightdelay; 11.0 min is today's computed value
fetch("/api/lightdelay").then(r => r.json()).then(d => { if (d.one_way_s) oneWayS = d.one_way_s; }).catch(() => {});
(q.get("status") || "").split(",").filter(Boolean).forEach(p => { const [k, v] = p.split(":"); status[k] = v; });
const sys = n => n.replace(/^HS_/, "").replace(/_[LR]$/, "");

// Hotspots, same coordinates as blender/build_astronaut.py (Blender Z-up -> Three Y-up)
const B = { HS_brain:[0,.01,1.70], HS_eyes_L:[-.035,-.09,1.665], HS_eyes_R:[.035,-.09,1.665], HS_lymph:[.05,-.04,1.52],
  HS_heart:[.035,-.07,1.33], HS_lungs_L:[-.08,-.04,1.36], HS_lungs_R:[.08,-.04,1.36], HS_spine:[0,.08,1.20],
  HS_gut:[0,-.08,1.07], HS_hip_L:[-.10,-.02,.93], HS_hip_R:[.10,-.02,.93], HS_leg_L:[-.11,-.05,.50], HS_leg_R:[.11,-.05,.50],
  HS_ear_L:[-.08,0,1.655], HS_ear_R:[.08,0,1.655], HS_kidney_L:[-.058,.07,1.10], HS_kidney_R:[.058,.07,1.10] };
const toThree = ([x, y, z]) => new THREE.Vector3(x, z, -y);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: PYRAMID });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05080d, 0.06);
scene.background = PYRAMID ? new THREE.Color(0x000000) : (() => {      // deep-space radial backdrop
  const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
  const g = x.createRadialGradient(256, 290, 10, 256, 290, 360);
  g.addColorStop(0, "#0d2230"); g.addColorStop(.45, "#071119"); g.addColorStop(1, "#020406");
  x.fillStyle = g; x.fillRect(0, 0, 512, 512); const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; return tx; })();
const twin = new THREE.Group(); twin.position.y = -0.9; scene.add(twin);

// ---------- hologram material: fresnel rim, scan bands, vertical sweep ----------
const holo = new THREE.ShaderMaterial({
  uniforms: { t: { value: 0 }, c: { value: CYAN } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ vec4 w = modelMatrix*vec4(position,1.); vY = w.y;
      vN = normalize(normalMatrix*normal); vec4 mv = viewMatrix*w; vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform float t; uniform vec3 c; varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){
      float rim = pow(1.-abs(dot(vN,vV)), 2.6);
      float bands = smoothstep(.92,1.,sin(vY*240.-t*2.2))*.22;
      float sweepY = mod(t*.35, 2.6) - 1.0;
      float sweep = exp(-pow((vY-sweepY)*28.,2.));
      float flick = .96+.04*sin(t*41.)*sin(t*7.3);
      vec3 col = c*(rim*1.6 + bands + sweep*1.4 + .035);
      float a = clamp(rim*.9 + bands + sweep*.7 + .03, 0., 1.)*flick;
      gl_FragColor = vec4(col*flick, a); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
});
const wire = new THREE.MeshBasicMaterial({ color: CYAN, wireframe: true, transparent: true, opacity: .045,
  blending: THREE.AdditiveBlending, depthWrite: false });

function dress(mesh) {      // hologram skin + faint wireframe layer
  mesh.material = holo;
  const w = new THREE.Mesh(mesh.geometry, wire); w.scale.setScalar(1.002); mesh.add(w);
}

// ---------- fallback figure (used when astronaut.glb is not there) ----------
function fallbackFigure() {
  const g = new THREE.Group();
  const add = geo => { const m = new THREE.Mesh(geo); dress(m); g.add(m); return m; };
  const limb = (a, b, r) => { const A = toThree(a), Bv = toThree(b), d = Bv.clone().sub(A);
    const m = add(new THREE.CapsuleGeometry(r, d.length(), 12, 24));
    m.position.copy(A.clone().add(Bv).multiplyScalar(.5)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); };
  const blob = (c, s) => { const m = add(new THREE.SphereGeometry(1, 48, 32)); m.position.copy(toThree(c)); m.scale.set(s[0], s[2], s[1]); };
  blob([0,0,1.665],[.085,.1,.118]); limb([0,.005,1.5],[0,.005,1.57],.05);
  blob([0,0,1.34],[.18,.11,.19]); blob([0,0,1.12],[.15,.1,.15]); blob([0,0,.96],[.17,.11,.1]);
  for (const s of [-1, 1]) {
    blob([s*.18,0,1.45],[.075,.065,.06]);
    limb([s*.21,0,1.44],[s*.26,.01,1.16],.05); limb([s*.26,.01,1.16],[s*.29,-.02,.9],.04);
    blob([s*.3,-.025,.83],[.035,.022,.06]);
    limb([s*.095,0,.92],[s*.11,-.01,.5],.075); limb([s*.11,-.01,.5],[s*.11,.01,.09],.055);
    blob([s*.11,-.05,.04],[.045,.11,.035]);
  }
  return g;
}

// ---------- hotspots: core + halo, HTML tag when not nominal ----------
const spots = [], haloTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d"), gr = x.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,"rgba(255,255,255,1)"); gr.addColorStop(.25,"rgba(255,255,255,.45)"); gr.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle = gr; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c); })();
function addSpot(name, pos) {
  const lv = LEVEL[status[sys(name)] || "nom"], col = new THREE.Color(lv[0]);
  const core = new THREE.Mesh(new THREE.SphereGeometry(.012, 16, 12), new THREE.MeshBasicMaterial({ color: col }));
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.setScalar(.09); core.add(halo); core.position.copy(pos); core.userData = { name, halo }; twin.add(core); spots.push(core); spotByName[name] = core;
  if (status[sys(name)] && status[sys(name)] !== "nom" && !name.endsWith("_R")) {
    const tag = document.createElement("div"); tag.className = "tag"; tag.style.color = lv[0];
    tag.textContent = `${sys(name).toUpperCase()} · ${lv[1]}`; document.body.appendChild(tag); core.userData.tag = tag;
  }
}

// Blender design (blender/build_twin.py): Body skin + ORG_* anatomy + HS_* hotspots
const bodyMeshes = [], organs = [], fxRings = [];
let fxFromBlender = false;
const ORG_SYS = { brain: "brain", eye: "eyes", ear: "ear", heart: "heart", vessels: "heart", lung: "lungs", airways: "lungs",
  spine: "spine", pelvis: "hip", bones_leg: "leg", gut: "gut", liver: "gut", stomach: "gut", kidney: "kidney", bladder: "kidney",
  lymph: "lymph" };                                    // skull, ribs, shoulders, arm bones: structure only
const organColor = sy => sy && status[sy] && status[sy] !== "nom" ? LEVEL[status[sy]][0] : (sy ? "#9FEFF2" : "#CFEFF5");
function organMat(col) {
  return new THREE.ShaderMaterial({ uniforms: { t: holo.uniforms.t, c: { value: new THREE.Color(col) }, k: { value: 1 } },
    vertexShader: holo.vertexShader,
    fragmentShader: `uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV;
      void main(){ float rim = pow(1.-abs(dot(vN,vV)), 1.8); float a = (rim*.85 + .12)*k; gl_FragColor = vec4(c*a*1.3, a); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
}
function useModel(gltf, label) {
  const meshes = [], hs = [];
  gltf.scene.traverse(o => { if (o.isMesh) meshes.push(o); if (o.name.startsWith("HS_")) hs.push(o); });
  meshes.forEach(m => {
    if (m.name.startsWith("ORG_")) {
      const key = m.name.slice(4).replace(/_[LR]$/, ""), sy = ORG_SYS[key] || null;
      m.material = organMat(organColor(sy)); if (!sy) m.material.uniforms.k.value = .55;
      m.userData = { sys: sy, key, base: m.scale.clone() }; organs.push(m);
    } else if (m.name.startsWith("FX_")) {                  // Blender-designed projector replaces the code-built one
      if (m.name === "FX_beam") m.material = beam.material;
      else { m.material = organMat("#5CE1E6"); m.material.uniforms.k.value = .9; if (m.name.startsWith("FX_ring")) fxRings.push(m); }
      fxFromBlender = true;
    } else { dress(m); bodyMeshes.push(m); }
  });
  if (fxFromBlender) { disc.visible = false; beam.visible = false; rings.forEach(r => r.visible = false); }
  twin.add(gltf.scene); twin.updateMatrixWorld(true);
  const have = new Set(hs.map(o => o.name));
  hs.forEach(o => { const p = new THREE.Vector3(); o.getWorldPosition(p); twin.worldToLocal(p); addSpot(o.name, p); });
  Object.entries(B).forEach(([n, p]) => { if (!have.has(n)) addSpot(n, toThree(p)); });
  buildParticles(); document.getElementById("src").textContent = `model: ${label}`;
}
const loader = new GLTFLoader();
const fromFile = () => loader.load("/static/models/twin.glb", g => useModel(g, "twin.glb (Blender)"), undefined, () =>
  loader.load("/static/models/astronaut.glb", g => useModel(g, "astronaut.glb"), undefined, () => {
    const fig = fallbackFigure(); twin.add(fig); twin.updateMatrixWorld(true);
    fig.traverse(o => { if (o.isMesh && o.material === holo) bodyMeshes.push(o); });
    Object.entries(B).forEach(([n, p]) => addSpot(n, toThree(p))); buildParticles();
    document.getElementById("src").textContent = "model: built-in (run blender/build_twin.py for full anatomy)";
  }));
if (window.TWIN_GLB_B64) {        // single-file preview: model embedded in the page
  const bin = Uint8Array.from(atob(window.TWIN_GLB_B64), ch => ch.charCodeAt(0));

// Forecast chart: history solid, forecast dashed, 95 % band light, 80 % band darker, NOW rule, threshold dashed.
function chartSVG(c, col) {
  const W = 268, H = 86, nh = 48, nf = 24, hist = [], fc = [];
  let x = c.mu, seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647 - .5;
  for (let i = 0; i < nh; i++) { x += c.drift + rnd() * c.sd * .5; hist.push(x); }
  for (let i = 1; i <= nf; i++) fc.push(x + c.drift * 1.6 * i);
  const all = hist.concat(fc, [c.thr, c.mu - 2 * c.sd, c.mu + 2 * c.sd]);
  const sdF = i => c.sd * (.8 + .22 * i);                       // band widens with horizon
  const lo = Math.min(...all, ...fc.map((v, i) => v - 1.96 * sdF(i))), hi = Math.max(...all, ...fc.map((v, i) => v + 1.96 * sdF(i)));
  const X = i => 4 + i / (nh + nf - 1) * (W - 8), Y = v => H - 6 - (v - lo) / (hi - lo || 1) * (H - 12);
  const band = z => fc.map((v, i) => `${X(nh + i)},${Y(v + z * sdF(i))}`).concat(fc.map((v, i) => `${X(nh + i)},${Y(v - z * sdF(i))}`).reverse()).join(" ");
  const line = (arr, o) => arr.map((v, i) => `${X(o + i)},${Y(v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin:8px 0 4px">
    <polygon points="${band(1.96)}" fill="${col}" opacity=".10"/><polygon points="${band(1.28)}" fill="${col}" opacity=".20"/>
    <line x1="4" x2="${W - 4}" y1="${Y(c.thr)}" y2="${Y(c.thr)}" stroke="${col}" stroke-dasharray="4 3" opacity=".9"/>
    <line x1="${X(nh - 1)}" x2="${X(nh - 1)}" y1="2" y2="${H - 2}" stroke="#56636F"/>
    <text x="${X(nh - 1) + 3}" y="10" fill="#56636F" font-size="8" letter-spacing="1">NOW</text>
    <text x="${W - 4}" y="${Y(c.thr) - 3}" fill="${col}" font-size="8" text-anchor="end">THRESHOLD ${c.thr} ${c.unit}</text>
    <polyline points="${line(hist, 0)}" fill="none" stroke="#5CE1E6" stroke-width="1.4"/>
    <polyline points="${line([hist[nh - 1], ...fc], nh - 1)}" fill="none" stroke="#5CE1E6" stroke-width="1.4" stroke-dasharray="3 3"/></svg>`;
}

    lastTick = t; const n = () => Math.random() - .5;
    live.hr += (67 - live.hr) * .1 + n() * 1.2; live.hrv += (41 - live.hrv) * .1 + n() * 1.4;
    live.sbp += (118 - live.sbp) * .1 + n(); live.dbp += (76 - live.dbp) * .1 + n() * .6;
    live.temp += (37.46 - live.temp) * .08 + n() * .012; live.spo2 += (97.4 - live.spo2) * .1 + n() * .15;
    live.resp += (17 - live.resp) * .1 + n() * .5; live.alert += (83.2 - live.alert) * .1 + n() * .5;
    live.rt += (326 - live.rt) * .1 + n() * 6; live.glu += (104 - live.glu) * .05 + n() * .8;
    for (const [k, a] of Object.entries(hist)) { a.push(live[k]); if (a.length > 90) a.shift(); }
    RO.forEach(r => { const [v, u] = r.main(); r.el.querySelector(".v").innerHTML = `${v}<small>${u}</small>`;
      r.el.querySelector(".d").textContent = r.d();
      r.el.querySelector(".rows").innerHTML = r.rows().map(([k, v]) => `<div class="s"><span>${k}</span><b>${v}</b></div>`).join(""); });
    const day = (150 * 86400 + 4 * 3600 + 12 * 60 + t) / 86400;
    document.getElementById("st-dose").textContent = `${(DOSE_PER_DAY * (day % 1)).toFixed(3)} mSv`;
    document.getElementById("st-career").textContent = `${(DOSE_PER_DAY * day).toFixed(0)} / 600 mSv`;
    document.getElementById("st-co2").textContent = "2.3 mmHg";
    document.getElementById("st-lt").textContent = `${Math.floor(oneWayS / 60)} min ${String(Math.round(oneWayS % 60)).padStart(2, "0")} s`;
  }
  const n = Math.max(1, Math.round(dt * 110));
  for (let i = 0; i < n; i++) { ecgPhase = (ecgPhase + live.hr / 60 / 110) % 1; ecgBuf.copyWithin(0, 1); ecgBuf[ecgBuf.length - 1] = ecgWave(ecgPhase); }
  const W = innerWidth, H = innerHeight;
  RO.forEach(r => {
    const c = LEVEL[status[r.sys] || "nom"][0], bw = 186, top = H * r.y, left = r.side === "l" ? W * .03 : W * .97 - bw;
    r.el.style.left = `${left}px`; r.el.style.top = `${top}px`;
    r.el.classList.toggle("keep", !!focus && focus === spotByName[r.at]);
    if (r.ecg) drawTrace(r.cv, ecgBuf, c, -.3, 1.05);
    else if (r.spark) { const a = hist[r.spark]; if (a.length > 2) drawTrace(r.cv, a, c, Math.min(...a) - .05, Math.max(...a) + .05); }
    const sp = spotByName[r.at];
    if (!sp) return;
    sp.getWorldPosition(v); v.project(cam);
    const sx = (v.x * .5 + .5) * W, sy = (-v.y * .5 + .5) * H, ay = top + 16;
    const ex = r.side === "l" ? left + bw + 1 : left - 1, mx = r.side === "l" ? ex + 28 : ex - 28;
    const vis = !(focus && focus !== sp) && !(document.body.classList.contains("card-on") && r.side === "r");
    r.line.setAttribute("points", `${sx},${sy} ${mx},${ay} ${ex},${ay}`);
    r.dot.setAttribute("cx", sx); r.dot.setAttribute("cy", sy);
    r.line.style.opacity = r.dot.style.opacity = vis ? "" : "0";
  });
}

// ---------- loop ----------
let prevT = 0;
const clock = new THREE.Clock(), v = new THREE.Vector3(), metEl = document.getElementById("met"), pad = n => String(Math.floor(n)).padStart(2, "0");
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  holo.uniforms.t.value = t; beam.material.uniforms.t.value = t; grade.uniforms.t.value = t;
  rings.forEach((r, i) => r.rotation.z = t * (i % 2 ? -.12 : .08) * (i + 1));
  fxRings.forEach((r, i) => r.rotation.y = t * (i % 2 ? -.12 : .08) * (i + 1));
  const p = motesGeo.attributes.position.array;
  for (let i = 0; i < N; i++) { p[i * 3 + 1] += seed[i] * .006; if (p[i * 3 + 1] > 2.6) p[i * 3 + 1] = 0; }
  motesGeo.attributes.position.needsUpdate = true;
  pMat.uniforms.uAmt.value *= .95;
  const beat = 1 + .075 * ecgWave((t * live.hr / 60) % 1), breath = Math.sin(t * 2 * Math.PI * live.resp / 60);
  organs.forEach(o => { const b = o.userData.base, key = o.userData.key;
    const k = key === "heart" ? beat : 1, sx = key === "lung" ? 1 + .03 * breath : 1, sy = key === "lung" ? 1 + .045 * breath : 1;
    o.scale.set(b.x * k * sx, b.y * k * sy, b.z * k * sx);
    o.material.uniforms.k.value = (o.userData.sys ? 1 : .55) * (currentSys ? (currentSys === o.userData.sys ? 1.9 : .45) : 1); });
  spots.forEach((m, i) => { const alert = status[sys(m.userData.name)] && status[sys(m.userData.name)] !== "nom";
    m.userData.halo.scale.setScalar(alert ? .09 + .05 * (.5 + .5 * Math.sin(t * 3.2 + i)) : .05); });
  const s = 150 * 86400 + 4 * 3600 + 12 * 60 + t;
  metEl.textContent = `MET ${pad(s / 86400).padStart(3, "0")}/${pad(s % 86400 / 3600)}:${pad(s % 3600 / 60)}:${pad(s % 60)}`;

  if (PYRAMID) {
    twin.rotation.y = t * .3;
    const W = out2d.width, w = W / 3; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, W);
    [[W / 2, w / 2, 0], [W - w / 2, W / 2, 90], [W / 2, W - w / 2, 180], [w / 2, W / 2, 270]].forEach(([x, y, rot], i) => {
      renderer.render(scene, cams[i]); ctx.save(); ctx.translate(x, y); ctx.rotate(rot * Math.PI / 180);
      ctx.drawImage(renderer.domElement, -w / 2, -w / 2, w, w); ctx.restore(); });
    return;
  }
  // slow cinematic orbit; when a hotspot is tapped, glide in and hold on it
  if (!focus && t - idleT > 6) orbitT += 1 / 60;          // auto-orbit pauses while you touch
  twin.rotation.y = userYaw;
  const a = orbitT * .11, r = (3.7 + .35 * Math.sin(orbitT * .07)) * zoom;
  if (focus) { focus.getWorldPosition(v);
    camGoal.set(v.x + Math.sin(a) * 1.15 * zoom, v.y + .06 + userTilt * .3, v.z + Math.cos(a) * 1.15 * zoom); lookGoal.copy(v).add(new THREE.Vector3(.18, 0, 0)); }
  else { camGoal.set(Math.sin(a) * r, .12 + .28 * Math.sin(orbitT * .05) + userTilt, Math.cos(a) * r); lookGoal.set(0, .02, 0); }
  cam.position.lerp(camGoal, .045); look.lerp(lookGoal, .06); cam.lookAt(look);
  composer.render();
  document.body.classList.toggle("dim", !!focus);
  updateReadouts(t, t - (prevT || t)); prevT = t;
  spots.forEach(m => { const tag = m.userData.tag; if (!tag) return;
    m.getWorldPosition(v); v.project(cam);
    const hidden = v.z > 1 || innerWidth > 820; tag.style.display = hidden ? "none" : "block";
    tag.style.left = `${(v.x * .5 + .5) * innerWidth}px`; tag.style.top = `${(-v.y * .5 + .5) * innerHeight}px`; });
});
</script>

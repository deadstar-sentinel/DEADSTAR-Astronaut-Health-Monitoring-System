<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEADSTAR SENTINEL</title>
<style>
  /* Visual language: flight software, not a landing page. Fonts get bundled in static/fonts. */
  :root{--bg:#05080D;--panel:#0B1118;--line:#1A2430;--ink:#E6EDF3;--ink2:#8A99A8;--mute:#56636F;
        --cyan:#5CE1E6;--nom:#3DD68C;--cau:#F5B83D;--crit:#FF5D5D}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  header b{letter-spacing:.14em}
  main{display:grid;grid-template-columns:260px 1fr 340px;gap:1px;background:var(--line);min-height:calc(100vh - 45px)}
  section{background:var(--panel);padding:12px 14px}
  .val{font-size:22px;color:var(--ink)}
  /* Status always = word + shape + colour (colorblind-safe, Fix #4) */
  .st-nom::before{content:"\25CF  ";color:var(--nom)} .st-cau::before{content:"\25B2  ";color:var(--cau)}
  .st-crit::before{content:"\25A0  ";color:var(--crit)}
  table{width:100%;border-collapse:collapse;font-size:11.5px} td{padding:3px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .unv{color:var(--cau)}
  @media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><b>DEADSTAR SENTINEL</b> <span class="lbl">&nbsp;Autonomous flight surgeon</span></div>
  <div class="mono"><span class="lbl">MET</span> <span id="met">—</span> &nbsp; <span class="lbl">Earth–Mars one-way</span> <span id="lt">—</span></div>
</header>
<main>
  <section><div class="lbl">Crew</div><p class="st-nom">MORI · NOVAK · VASQUEZ · OKAFOR</p><p class="lbl" style="margin-top:8px">Engine workstream: synth.py</p></section>
  <section><div class="lbl">Body twin · forecast</div><p style="color:var(--mute)">Hologram (Three.js) and forecast charts mount here.</p></section>
  <section><div class="lbl">Methods · every constant and its source</div><table id="methods"></table></section>
</main>
<script>
  const mission = new URLSearchParams(location.search).get("mission") || "mars_transit";
  const t0 = Date.now(), metStart = 150*86400 + 4*3600 + 12*60;   // demo MET 150/04:12
  const pad = n => String(Math.floor(n)).padStart(2,"0");
  setInterval(() => { const s = metStart + (Date.now()-t0)/1000;
    document.getElementById("met").textContent = `${pad(s/86400).padStart(3,"0")}/${pad(s%86400/3600)}:${pad(s%3600/60)}:${pad(s%60)}`; }, 1000);
  fetch(`/api/lightdelay?mission=${mission}`).then(r => r.json()).then(d => {
    document.getElementById("lt").textContent = `${Math.floor(d.one_way_s/60)} min ${pad(d.one_way_s%60)} s`;
  }).catch(() => document.getElementById("lt").textContent = "LOS");
  fetch("/api/constants").then(r => r.json()).then(rows => {
    document.getElementById("methods").innerHTML = rows.map(c =>
      `<tr><td class="mono">${c.name}</td><td>${c.source}${c.verified ? "" : ' <span class="unv">▲ unverified</span>'}</td></tr>`).join("");
  });
</script>
</body>
</html>
